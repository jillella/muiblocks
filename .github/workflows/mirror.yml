name: Mirror to stitchui/muiblocks

# Mirrors this repository (jillella/muiblocks) to stitchui/muiblocks.
#
# jillella/muiblocks is the SOURCE OF TRUTH. stitchui/muiblocks is a read-only
# mirror: this workflow force-pushes over it, so any commit that exists only on
# the mirror will be destroyed. Never commit directly to stitchui/muiblocks.
#
# Setup (one time):
#   1. Create a fine-grained PAT or classic PAT with write access to
#      stitchui/muiblocks (classic: `repo` scope).
#   2. In jillella/muiblocks go to
#      Settings > Secrets and variables > Actions > New repository secret
#      and add it as MIRROR_TOKEN.

on:
  # Only main is mirrored, so only main pushes need to trigger a run. Short-lived
  # branches (v0/*, feature branches) are deliberately ignored - they would just
  # clutter the mirror and burn Actions minutes.
  push:
    branches:
      - main
    tags:
      - '**'
  # Mirror tag deletions.
  delete:
  # Allow a manual re-sync from the Actions tab.
  workflow_dispatch:

# Never run two mirror pushes at once - concurrent force-pushes can interleave
# and leave the mirror in an inconsistent state.
concurrency:
  group: mirror-to-stitchui
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Skip on forks, which do not have access to MIRROR_TOKEN.
    if: github.repository == 'jillella/muiblocks'

    steps:
      - name: Verify MIRROR_TOKEN is configured
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN secret is not set. Add a PAT with write access to stitchui/muiblocks under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Push mirror to stitchui/muiblocks
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          # Clone bare: no working tree, so no branch is "checked out" and every
          # branch/tag can be updated freely. actions/checkout is deliberately
          # not used here - it leaves main checked out, which makes git refuse to
          # fetch into refs/heads/main.
          git clone --bare "https://x-access-token:${SOURCE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source.git
          cd source.git

          # Mirror ONLY main plus tags. Explicit refspecs are used instead of
          # --mirror because --mirror would copy every branch (including throwaway
          # v0/* branches) and would also try to push GitHub's read-only
          # refs/pull/* refs, which the destination rejects as hidden refs.
          #
          # --prune is scoped to the refspecs listed below, so it cleans up deleted
          # tags but never touches unrelated branches on the destination.
          git push --prune --force \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/stitchui/muiblocks.git" \
            '+refs/heads/main:refs/heads/main' \
            '+refs/tags/*:refs/tags/*'

          echo "Mirrored $(git rev-parse --short HEAD) to stitchui/muiblocks"
